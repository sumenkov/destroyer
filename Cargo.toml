[package]
name = "destroyer"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Secure multi-pass disk wiper (Linux/macOS). USE WITH EXTREME CAUTION."

[dependencies]
libc = "0.2"
# Только для GUI (feature = "gui"). Чистый Rust, без системных зависимостей
# вроде GTK — только X11/Wayland dev-заголовки, которые обычно уже стоят
# на десктопных дистрибутивах Linux.
eframe = { version = "0.29", optional = true }

[features]
default = ["durable", "direct"]
durable = []
direct = []
test-support = []
# GUI пока только для Linux (см. src/bin/destroyer_gui.rs — на других ОС
# бинарник печатает сообщение и завершается с ошибкой).
gui = ["dep:eframe"]

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[lib]
name = "destroyer"
path = "src/lib.rs"

[[bin]]
name = "destroyer"
path = "src/main.rs"

[[bin]]
name = "destroyer-gui"
path = "src/bin/destroyer_gui.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
panic = "abort"

[[bench]]
name = "buffer"
harness = false
